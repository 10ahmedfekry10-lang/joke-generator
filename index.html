<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة فكرة | أبو أحمد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1c1510;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.22) 0%, transparent 60%),
                linear-gradient(135deg, #281e14 0%, #0d0906 100%),
                radial-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 20px 20px;
            color: #fff8ee;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 25px;
            border: 2px solid #d4af37;
            border-radius: 32px;
            background: rgba(24, 18, 12, 0.94);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.85), 0 0 40px rgba(212, 175, 55, 0.25);
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .logo-box {
            width: 95px;
            height: 95px;
            margin: 0 auto 22px auto;
            border: 2px solid #d4af37;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #33261a 0%, #120c08 100%);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            position: relative;
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .logo-box:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .logo-inner {
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 38px;
        }

        .logo-box:hover .logo-inner {
            transform: rotate(0deg);
        }

        h1 {
            color: #d4af37;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }
        .subtitle {
            color: #d2c3a9;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 35px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 15px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 22px;
            margin: 14px 0;
            background: linear-gradient(135deg, #2c2117 0%, #140e09 100%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #fff8ee;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            border-radius: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .action-btn i.icon-left {
            color: #d4af37;
            font-size: 20px;
            width: 25px;
            text-align: center;
            transition: 0.3s;
        }
        .action-btn span {
            flex-grow: 1;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .action-btn i.arrow {
            color: #9c8a70;
            font-size: 12px;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #d4af37;
            color: #0d0906;
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.85);
            transform: translateY(-3px);
        }
        
        .action-btn:hover i.icon-left,
        .action-btn:hover i.arrow {
            color: #0d0906;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #9c8a70;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- اللوجو -->
        <div class="logo-box">
            <div class="logo-inner">
                <i class="fa-solid fa-lightbulb"></i>
            </div>
        </div>

        <h1>مكتبة فكرة</h1>
        <div class="subtitle">إدارة أبو أحمد</div>

        <!-- الأزرار -->
        <a href="https://wa.me/201288373989" class="action-btn" target="_blank">
            <i class="fa-brands fa-whatsapp icon-left"></i>
            <span>تواصل عبر الواتساب</span>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <!-- زر الفيسبوك -->
        <a href="https://www.facebook.com/share/1HiTrZTm7k/" class="action-btn" target="_blank">
            <i class="fa-brands fa-facebook icon-left" style="color: #1877f2;"></i>
            <span>صفحتنا على الفيسبوك</span>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <!-- زر الاتصال المباشر (بيفتح الهاتف فوراً) -->
        <a href="tel:01288373989" class="action-btn">
            <i class="fa-solid fa-phone-volume icon-left"></i>
            <span>الاتصال المباشر</span>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <!-- زر حفظ الرقم بطريقة ملف الـ vCard -->
        <a href="#" id="saveContactBtn" class="action-btn">
            <i class="fa-solid fa-address-book icon-left"></i>
            <span>حفظ الرقم في جهات الاتصال</span>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <a href="https://maps.google.com/?q=مكتبة+فكرة" class="action-btn" target="_blank">
            <i class="fa-solid fa-location-dot icon-left"></i>
            <span>موقعنا على الخريطة (GPS)</span>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <a href="رابط_صفحة_التقييم_مباشرة" class="action-btn" target="_blank">
            <i class="fa-solid fa-star icon-left"></i>
            <span>قيمنا على جوجل ماب</span>
            <i class="fa-solid fa-chevron-left arrow"></i>
        </a>

        <div class="footer-note">تحت أمركم دائماً</div>
    </div>

    <script>
        // زر حفظ الرقم (ملف VCF)
        document.getElementById('saveContactBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const vcard = 
`BEGIN:VCARD
VERSION:3.0
FN:مكتبة فكرة - أبو أحمد
TEL;TYPE=CELL:01288373989
END:VCARD`;

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Fikra_Library.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        });
    </script>

</body>
</html>
